name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (static export)
        run: npm run build:static
        env:
          # Empty on purpose: CI builds run in DEMO mode (no Firebase config),
          # which is exactly the zero-config path reviewers take.
          NEXT_PUBLIC_FIREBASE_API_KEY: ""
